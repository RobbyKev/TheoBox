<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Hörspiel Box</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-base: #080a0f;
            --bg-card: rgba(255, 255, 255, 0.04);
            --border-color: rgba(255, 255, 255, 0.08);
            --accent-spotify: #1DB954;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
        }

        body.night-mode {
            --bg-base: #030406;
            --bg-card: rgba(255, 255, 255, 0.015);
            --border-color: rgba(255, 255, 255, 0.03);
            --text-main: #475569;
            --text-sub: #1e293b;
            --accent-spotify: #15803d;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Inter', sans-serif;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        body {
            background-color: var(--bg-base);
            color: var(--text-main);
            min-height: 100vh;
            padding: calc(env(safe-area-inset-top) + 16px) 16px calc(env(safe-area-inset-bottom) + 24px);
            transition: background-color 0.3s, color 0.3s;
        }

        .container {
            max-width: 500px;
            margin: 0 auto;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .brand {
            font-size: 1.3rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            padding: 4px 8px;
            border-radius: 12px;
        }

        .brand-icon {
            width: 8px;
            height: 8px;
            background-color: var(--accent-spotify);
            border-radius: 50%;
            box-shadow: 0 0 12px var(--accent-spotify);
        }

        .actions {
            display: flex;
            gap: 8px;
        }

        .btn-icon {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            width: 42px;
            height: 42px;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
            cursor: pointer;
        }

        .btn-icon.admin-btn {
            display: none;
            border-color: var(--accent-spotify);
            color: var(--accent-spotify);
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 14px;
        }

        .card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 18px;
            padding: 10px;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            position: relative;
            backdrop-filter: blur(10px);
        }

        .card:active {
            transform: scale(0.97);
            opacity: 0.9;
        }

        .delete-btn {
            position: absolute;
            top: -6px;
            left: -6px;
            background: #ef4444;
            color: #fff;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            display: none;
            align-items: center;
            justify-content: center;
            font-size: 0.75rem;
            font-weight: bold;
            z-index: 10;
            box-shadow: 0 2px 8px rgba(0,0,0,0.4);
        }

        body.admin-mode .delete-btn {
            display: flex;
        }

        .cover-wrap {
            width: 100%;
            aspect-ratio: 1 / 1;
            border-radius: 12px;
            overflow: hidden;
            margin-bottom: 8px;
            position: relative;
            background: #121820;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .cover-wrap img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .title {
            font-size: 0.85rem;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .sub {
            font-size: 0.72rem;
            color: var(--text-sub);
            margin-top: 2px;
        }

        /* Modal Styles */
        .modal {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(20px);
            z-index: 100;
            display: none;
            justify-content: center;
            align-items: flex-end;
        }

        .modal.open {
            display: flex;
        }

        .modal-body {
            background: #121720;
            border: 1px solid var(--border-color);
            border-radius: 28px 28px 0 0;
            width: 100%;
            max-width: 500px;
            max-height: 80vh;
            overflow-y: auto;
            padding: 20px 20px calc(env(safe-area-inset-bottom) + 20px);
        }

        .modal-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 20px;
        }

        .close-btn {
            margin-left: auto;
            background: rgba(255, 255, 255, 0.1);
            border: none;
            color: #fff;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            font-size: 1rem;
            cursor: pointer;
        }

        .form-group {
            margin-bottom: 14px;
        }

        .form-group label {
            display: block;
            font-size: 0.75rem;
            color: var(--text-sub);
            margin-bottom: 6px;
        }

        .form-group input {
            width: 100%;
            padding: 12px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            color: #fff;
            font-size: 0.9rem;
            outline: none;
        }

        .preview-box {
            display: none;
            align-items: center;
            gap: 12px;
            padding: 10px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 12px;
            margin-bottom: 14px;
        }

        .preview-box img {
            width: 48px;
            height: 48px;
            border-radius: 8px;
            object-fit: cover;
        }

        .btn-submit {
            width: 100%;
            padding: 14px;
            background: var(--accent-spotify);
            border: none;
            border-radius: 12px;
            color: #000;
            font-weight: 700;
            font-size: 0.95rem;
            cursor: pointer;
        }

        .toast {
            position: fixed;
            bottom: calc(env(safe-area-inset-bottom) + 20px);
            left: 50%;
            transform: translateX(-50%);
            background: rgba(29, 185, 84, 0.9);
            color: #000;
            font-weight: 600;
            font-size: 0.8rem;
            padding: 8px 16px;
            border-radius: 20px;
            z-index: 200;
            display: none;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <div class="brand" id="brandTitle">
            <div class="brand-icon"></div>
            <span>Hörspiel Box</span>
        </div>
        <div class="actions">
            <button class="btn-icon admin-btn" id="addToggle">＋</button>
            <button class="btn-icon" id="nightToggle">🌙</button>
        </div>
    </header>

    <div class="grid" id="grid"></div>
</div>

<div class="toast" id="toast"></div>

<!-- Add Modal -->
<div class="modal" id="addModal">
    <div class="modal-body">
        <div class="modal-header">
            <h3>Hörspiel hinzufügen</h3>
            <button class="close-btn" onclick="closeAddModal()">✕</button>
        </div>
        <div class="form-group">
            <label>Spotify Link (Künstler, Album, Podcast oder Playlist)</label>
            <input type="text" id="spotifyUrlInput" placeholder="https://open.spotify.com/artist/...">
        </div>
        <div class="preview-box" id="previewBox">
            <img id="previewImg" src="">
            <div style="font-size: 0.85rem; font-weight: 600;" id="previewText"></div>
        </div>
        <button class="btn-submit" onclick="addCustomItem()">Hinzufügen</button>
    </div>
</div>

<script>
    const defaultItems = [
        { title: 'Benjamin Blümchen', sub: 'Künstlerprofil', spotifyUrl: 'https://open.spotify.com/artist/0d8f3T0PzYp1xUe53C1Nn0' },
        { title: 'Die drei ???', sub: 'Künstlerprofil', spotifyUrl: 'https://open.spotify.com/artist/3b371b695781a78d0f19c961' },
        { title: 'Sendung mit der Maus', sub: 'Podcast', spotifyUrl: 'https://open.spotify.com/show/3qC5xQx5B2G15Z15' },
        { title: 'Disney Hörspiele', sub: 'Playlist', spotifyUrl: 'https://open.spotify.com/playlist/37i9dQZF1DX4sWSpwq3LiO' },
        { title: 'Asterix & Obelix', sub: 'Künstlerprofil', spotifyUrl: 'https://open.spotify.com/artist/234z9wIbfT22JdYgB309bE' },
        { title: 'Pettersson & Findus', sub: 'Künstlerprofil', spotifyUrl: 'https://open.spotify.com/artist/6l1dC5vB4WvR2yK9dE8d5t' }
    ];

    let items = JSON.parse(localStorage.getItem('my_hoerspiele')) || defaultItems;
    let clickCount = 0;
    let clickTimer = null;
    let isAdmin = false;

    const grid = document.getElementById('grid');

    // 5x Tippen auf "Hörspiel Box" aktiviert/deaktiviert den Admin-Modus (Plus-Button & Löschen)
    document.getElementById('brandTitle').onclick = () => {
        clickCount++;
        clearTimeout(clickTimer);
        
        if (clickCount >= 5) {
            isAdmin = !isAdmin;
            document.body.classList.toggle('admin-mode', isAdmin);
            document.getElementById('addToggle').style.display = isAdmin ? 'flex' : 'none';
            showToast(isAdmin ? '🔒 Admin-Modus AKTIV' : '🔓 Admin-Modus BEENDET');
            clickCount = 0;
            renderGrid();
        } else {
            clickTimer = setTimeout(() => { clickCount = 0; }, 1500);
        }
    };

    function showToast(msg) {
        const toast = document.getElementById('toast');
        toast.innerText = msg;
        toast.style.display = 'block';
        setTimeout(() => { toast.style.display = 'none'; }, 2000);
    }

    async function fetchCover(spotifyUrl) {
        try {
            const res = await fetch(`https://open.spotify.com/oembed?url=${encodeURIComponent(spotifyUrl)}`);
            const data = await res.json();
            return {
                cover: data.thumbnail_url,
                title: data.title
            };
        } catch (e) {
            return {
                cover: '',
                title: 'Hörspiel'
            };
        }
    }

    async function renderGrid() {
        grid.innerHTML = '';

        items.forEach((item, index) => {
            const el = document.createElement('div');
            el.className = 'card';
            
            // Falls bereits gechached, sofort anzeigen
            const coverSrc = item.cachedCover || '';
            const titleText = item.title || item.cachedTitle || 'Lade...';

            el.innerHTML = `
                <div class="delete-btn" onclick="deleteItem(event, ${index})">✕</div>
                <div class="cover-wrap">
                    <img id="img-${index}" src="${coverSrc}" style="${coverSrc ? 'display:block' : 'display:none'}">
                </div>
                <div class="title" id="title-${index}">${titleText}</div>
                <div class="sub">${item.sub || 'Spotify'}</div>
            `;
            
            el.onclick = (e) => {
                if (e.target.classList.contains('delete-btn')) return;
                window.location.href = item.spotifyUrl;
            };
            grid.appendChild(el);

            // Nachladen im Hintergrund, falls noch nicht im Speicher (Cache)
            if (!item.cachedCover) {
                fetchCover(item.spotifyUrl).then(data => {
                    item.cachedCover = data.cover;
                    if (!item.title) item.title = data.title;
                    
                    const imgEl = document.getElementById(`img-${index}`);
                    const titleEl = document.getElementById(`title-${index}`);
                    if (imgEl && data.cover) {
                        imgEl.src = data.cover;
                        imgEl.style.display = 'block';
                    }
                    if (titleEl && data.title) titleEl.innerText = item.title;

                    localStorage.setItem('my_hoerspiele', JSON.stringify(items));
                });
            }
        });
    }

    function deleteItem(e, index) {
        e.stopPropagation();
        items.splice(index, 1);
        localStorage.setItem('my_hoerspiele', JSON.stringify(items));
        renderGrid();
    }

    // Live-Vorschau beim Einfügen eines Links
    document.getElementById('spotifyUrlInput').oninput = async (e) => {
        const url = e.target.value.trim();
        if (url.includes('spotify.com')) {
            const data = await fetchCover(url);
            document.getElementById('previewImg').src = data.cover;
            document.getElementById('previewText').innerText = data.title;
            document.getElementById('previewBox').style.display = 'flex';
        } else {
            document.getElementById('previewBox').style.display = 'none';
        }
    };

    document.getElementById('addToggle').onclick = () => {
        document.getElementById('addModal').classList.add('open');
    };

    function closeAddModal() {
        document.getElementById('addModal').classList.remove('open');
        document.getElementById('previewBox').style.display = 'none';
        document.getElementById('spotifyUrlInput').value = '';
    }

    async function addCustomItem() {
        const url = document.getElementById('spotifyUrlInput').value.trim();
        if (!url) return;

        const data = await fetchCover(url);
        items.push({
            title: data.title,
            sub: 'Hinzugefügt',
            spotifyUrl: url,
            cachedCover: data.cover,
            cachedTitle: data.title
        });

        localStorage.setItem('my_hoerspiele', JSON.stringify(items));
        closeAddModal();
        renderGrid();
    }

    document.getElementById('nightToggle').onclick = () => document.body.classList.toggle('night-mode');

    renderGrid();
</script>
</body>
</html>
