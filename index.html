<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hörspiel Mediathek</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-base: #080a0f;
            --bg-card: rgba(255, 255, 255, 0.03);
            --bg-card-hover: rgba(255, 255, 255, 0.07);
            --border-color: rgba(255, 255, 255, 0.08);
            --accent-spotify: #1DB954;
            --text-main: #f1f5f9;
            --text-sub: #94a3b8;
        }

        body.night-mode {
            --bg-base: #030406;
            --bg-card: rgba(255, 255, 255, 0.015);
            --text-main: #64748b;
            --text-sub: #334155;
            --accent-spotify: #15803d;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', -apple-system, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-base);
            color: var(--text-main);
            min-height: 100vh;
            padding: 24px 16px 80px;
            transition: background-color 0.3s, color 0.3s;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }

        .brand {
            font-size: 1.25rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .brand-icon {
            width: 10px;
            height: 10px;
            background-color: var(--accent-spotify);
            border-radius: 50%;
            box-shadow: 0 0 10px var(--accent-spotify);
        }

        .actions {
            display: flex;
            gap: 12px;
        }

        .btn-icon {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            width: 40px;
            height: 40px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 16px;
        }

        @media (min-width: 600px) {
            .grid { grid-template-columns: repeat(3, 1fr); }
        }

        @media (min-width: 850px) {
            .grid { grid-template-columns: repeat(4, 1fr); }
        }

        .card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 12px;
            cursor: pointer;
            text-decoration: none;
            color: inherit;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .cover-wrap {
            width: 100%;
            aspect-ratio: 1 / 1;
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 12px;
            position: relative;
            background: #111;
        }

        .cover-wrap img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .badge {
            position: absolute;
            top: 8px;
            right: 8px;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255,255,255,0.1);
            color: #fff;
            font-size: 0.65rem;
            font-weight: 600;
            padding: 3px 8px;
            border-radius: 20px;
        }

        .title {
            font-size: 0.9rem;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .sub {
            font-size: 0.75rem;
            color: var(--text-sub);
            margin-top: 2px;
        }

        /* Overlay Modal für Serien/Alben */
        .modal {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(16px);
            z-index: 100;
            display: none;
            justify-content: center;
            align-items: flex-end;
            opacity: 0;
            transition: opacity 0.25s;
        }

        .modal.open {
            display: flex;
            opacity: 1;
        }

        .modal-body {
            background: #0f131a;
            border: 1px solid var(--border-color);
            border-radius: 24px 24px 0 0;
            width: 100%;
            max-width: 800px;
            max-height: 85vh;
            overflow-y: auto;
            padding: 24px;
        }

        .modal-header {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-bottom: 24px;
        }

        .modal-header img {
            width: 64px;
            height: 64px;
            border-radius: 12px;
            object-fit: cover;
        }

        .close-btn {
            margin-left: auto;
            background: none;
            border: none;
            color: var(--text-sub);
            font-size: 1.5rem;
            cursor: pointer;
        }

        .album-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .album-item {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 10px;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            text-decoration: none;
            color: inherit;
        }

        .album-item img {
            width: 48px;
            height: 48px;
            border-radius: 8px;
            object-fit: cover;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <div class="brand">
            <div class="brand-icon"></div>
            <span>Hörspiel Box</span>
        </div>
        <div class="actions">
            <button class="btn-icon" id="nightToggle">🌙</button>
        </div>
    </header>

    <div class="grid" id="grid"></div>
</div>

<!-- Modal für Folgen/Alben -->
<div class="modal" id="modal">
    <div class="modal-body">
        <div class="modal-header">
            <img id="modalCover" src="" alt="">
            <div>
                <h2 id="modalTitle"></h2>
                <p id="modalSub" style="color: var(--text-sub); font-size: 0.85rem;"></p>
            </div>
            <button class="close-btn" id="closeModal">✕</button>
        </div>
        <div class="album-list" id="albumList"></div>
    </div>
</div>

<script>
    // Serien & Hörspiel-Daten
    const items = [
        {
            type: 'series',
            title: 'Benjamin Blümchen',
            cover: 'https://i.scdn.co/image/ab6761610000e5eb4f4e7c0d381048b3bf21ca2b',
            count: '150+ Folgen',
            albums: [
                { title: 'Folge 1: Als Wetterhahn', url: 'https://open.spotify.com/intl-de/album/1P4Z1iM7fC2L2n3n4m5K6L', cover: 'https://i.scdn.co/image/ab67616d0000b273b5d27575fa3d66df2e6d38b5' },
                { title: 'Folge 2: Auf dem Bauernhof', url: 'https://open.spotify.com/intl-de/album/2Q5X9yM8fC2L2n3n4m5K6L', cover: 'https://i.scdn.co/image/ab67616d0000b2738b30d31c0a0c20251bc89a3f' },
                { title: 'Folge 3: Und der Rote Graf', url: 'https://open.spotify.com/intl-de/album/3R5X9yM8fC2L2n3n4m5K6L', cover: 'https://i.scdn.co/image/ab67616d0000b2734138e6988880e6efc7159eb5' }
            ]
        },
        {
            type: 'series',
            title: 'Die drei ???',
            cover: 'https://i.scdn.co/image/ab6761610000e5eb3b371b695781a78d0f19c961',
            count: '220+ Folgen',
            albums: [
                { title: 'Folge 1: Super-Papagei', url: 'https://open.spotify.com/intl-de/album/0d8f3T0PzYp1xUe53C1Nn0', cover: 'https://i.scdn.co/image/ab67616d0000b273b5f3333e659b8b209d80313f' },
                { title: 'Folge 2: Der Karpatenhund', url: 'https://open.spotify.com/intl-de/album/0d8f3T0PzYp1xUe53C1Nn1', cover: 'https://i.scdn.co/image/ab67616d0000b2739227f6ff268f7f50a31eb252' }
            ]
        },
        {
            type: 'direct',
            title: 'Sendung mit der Maus',
            sub: 'Podcast',
            cover: 'https://i.scdn.co/image/ab6765630000ba8a7c264a7846fa7a49dd299bdf',
            url: 'https://open.spotify.com/show/3qC5xQx5B2G15Z15'
        },
        {
            type: 'direct',
            title: 'Disney Klassiker',
            sub: 'Playlist',
            cover: 'https://i.scdn.co/image/ab67706f000000025f1a52b827e80064a377042a',
            url: 'https://open.spotify.com/playlist/37i9dQZF1DX4sWSpwq3LiO'
        }
    ];

    const grid = document.getElementById('grid');
    const modal = document.getElementById('modal');
    const albumList = document.getElementById('albumList');

    function renderGrid() {
        grid.innerHTML = '';
        items.forEach((item) => {
            const el = document.createElement('div');
            el.className = 'card';
            el.innerHTML = `
                <div class="cover-wrap">
                    <img src="${item.cover}" alt="${item.title}">
                    ${item.type === 'series' ? `<span class="badge">${item.count}</span>` : ''}
                </div>
                <div class="title">${item.title}</div>
                <div class="sub">${item.sub || 'Serie'}</div>
            `;
            
            el.onclick = () => {
                if(item.type === 'series') {
                    openSeries(item);
                } else {
                    window.open(item.url, '_blank');
                }
            };
            grid.appendChild(el);
        });
    }

    function openSeries(series) {
        document.getElementById('modalCover').src = series.cover;
        document.getElementById('modalTitle').innerText = series.title;
        document.getElementById('modalSub').innerText = series.count;
        
        albumList.innerHTML = '';
        series.albums.forEach(album => {
            const a = document.createElement('a');
            a.className = 'album-item';
            a.href = album.url;
            a.target = '_blank';
            a.innerHTML = `
                <img src="${album.cover}">
                <div style="font-weight: 500; font-size: 0.9rem;">${album.title}</div>
            `;
            albumList.appendChild(a);
        });

        modal.classList.add('open');
    }

    document.getElementById('closeModal').onclick = () => modal.classList.remove('open');
    document.getElementById('nightToggle').onclick = () => document.body.classList.toggle('night-mode');

    renderGrid();
</script>
</body>
</html>
