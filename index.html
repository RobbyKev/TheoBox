<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Hörspiel Box</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-base: #080a0f;
            --bg-card: rgba(255, 255, 255, 0.04);
            --border-color: rgba(255, 255, 255, 0.08);
            --accent-spotify: #1DB954;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
        }

        body.night-mode {
            --bg-base: #030406;
            --bg-card: rgba(255, 255, 255, 0.015);
            --border-color: rgba(255, 255, 255, 0.03);
            --text-main: #475569;
            --text-sub: #1e293b;
            --accent-spotify: #15803d;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Inter', sans-serif;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        body {
            background-color: var(--bg-base);
            color: var(--text-main);
            min-height: 100vh;
            padding: calc(env(safe-area-inset-top) + 16px) 16px calc(env(safe-area-inset-bottom) + 24px);
            transition: background-color 0.3s, color 0.3s;
        }

        .container {
            max-width: 500px;
            margin: 0 auto;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .brand {
            font-size: 1.3rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .brand-icon {
            width: 8px;
            height: 8px;
            background-color: var(--accent-spotify);
            border-radius: 50%;
            box-shadow: 0 0 12px var(--accent-spotify);
        }

        .actions {
            display: flex;
            gap: 8px;
        }

        .btn-icon {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            width: 42px;
            height: 42px;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
            cursor: pointer;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 14px;
        }

        .card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 18px;
            padding: 10px;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            position: relative;
            backdrop-filter: blur(10px);
        }

        .card:active {
            transform: scale(0.97);
            opacity: 0.9;
        }

        .cover-wrap {
            width: 100%;
            aspect-ratio: 1 / 1;
            border-radius: 12px;
            overflow: hidden;
            margin-bottom: 8px;
            position: relative;
            background: #121820;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .cover-wrap img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .badge {
            position: absolute;
            top: 6px;
            right: 6px;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255,255,255,0.15);
            color: #fff;
            font-size: 0.65rem;
            font-weight: 600;
            padding: 3px 8px;
            border-radius: 20px;
        }

        .title {
            font-size: 0.85rem;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .sub {
            font-size: 0.72rem;
            color: var(--text-sub);
            margin-top: 2px;
        }

        /* Modal Styles */
        .modal {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(20px);
            z-index: 100;
            display: none;
            justify-content: center;
            align-items: flex-end;
            opacity: 0;
            transition: opacity 0.2s;
        }

        .modal.open {
            display: flex;
            opacity: 1;
        }

        .modal-body {
            background: #121720;
            border: 1px solid var(--border-color);
            border-radius: 28px 28px 0 0;
            width: 100%;
            max-width: 500px;
            max-height: 80vh;
            overflow-y: auto;
            padding: 20px 20px calc(env(safe-area-inset-bottom) + 20px);
        }

        .modal-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 20px;
        }

        .close-btn {
            margin-left: auto;
            background: rgba(255, 255, 255, 0.1);
            border: none;
            color: #fff;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            font-size: 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        .form-group {
            margin-bottom: 14px;
        }

        .form-group label {
            display: block;
            font-size: 0.75rem;
            color: var(--text-sub);
            margin-bottom: 6px;
        }

        .form-group input {
            width: 100%;
            padding: 12px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            color: #fff;
            font-size: 0.9rem;
            outline: none;
        }

        .btn-submit {
            width: 100%;
            padding: 14px;
            background: var(--accent-spotify);
            border: none;
            border-radius: 12px;
            color: #000;
            font-weight: 700;
            font-size: 0.95rem;
            cursor: pointer;
            margin-top: 10px;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <div class="brand">
            <div class="brand-icon"></div>
            <span>Hörspiel Box</span>
        </div>
        <div class="actions">
            <button class="btn-icon" id="addToggle">＋</button>
            <button class="btn-icon" id="nightToggle">🌙</button>
        </div>
    </header>

    <div class="grid" id="grid"></div>
</div>

<!-- Add Modal -->
<div class="modal" id="addModal">
    <div class="modal-body">
        <div class="modal-header">
            <h3>Neues Hörspiel / Link</h3>
            <button class="close-btn" onclick="closeAddModal()">✕</button>
        </div>
        <div class="form-group">
            <label>Spotify Link (Album, Podcast, Künstler)</label>
            <input type="text" id="spotifyUrlInput" placeholder="https://open.spotify.com/album/...">
        </div>
        <button class="btn-submit" onclick="addCustomItem()">Hinzufügen</button>
    </div>
</div>

<script>
    // Standard-Einträge mit Spotify URLs
    const defaultItems = [
        {
            title: 'Benjamin Blümchen',
            sub: 'Künstlerprofil',
            spotifyUrl: 'https://open.spotify.com/artist/0d8f3T0PzYp1xUe53C1Nn0'
        },
        {
            title: 'Die drei ???',
            sub: 'Künstlerprofil',
            spotifyUrl: 'https://open.spotify.com/artist/3b371b695781a78d0f19c961'
        },
        {
            title: 'Sendung mit der Maus',
            sub: 'Podcast',
            spotifyUrl: 'https://open.spotify.com/show/3qC5xQx5B2G15Z15'
        },
        {
            title: 'Disney Hörspiele',
            sub: 'Playlist',
            spotifyUrl: 'https://open.spotify.com/playlist/37i9dQZF1DX4sWSpwq3LiO'
        },
        {
            title: 'Asterix & Obelix',
            sub: 'Künstlerprofil',
            spotifyUrl: 'https://open.spotify.com/artist/234z9wIbfT22JdYgB309bE'
        },
        {
            title: 'Pettersson & Findus',
            sub: 'Künstlerprofil',
            spotifyUrl: 'https://open.spotify.com/artist/6l1dC5vB4WvR2yK9dE8d5t'
        }
    ];

    let items = JSON.parse(localStorage.getItem('my_hoerspiele')) || defaultItems;

    const grid = document.getElementById('grid');

    async function fetchCover(spotifyUrl) {
        try {
            const res = await fetch(`https://open.spotify.com/oembed?url=${encodeURIComponent(spotifyUrl)}`);
            const data = await res.json();
            return {
                cover: data.thumbnail_url,
                title: data.title
            };
        } catch (e) {
            return {
                cover: 'https://via.placeholder.com/300/121820/ffffff?text=Spotify',
                title: 'Hörspiel'
            };
        }
    }

    async function renderGrid() {
        grid.innerHTML = '<p style="color:var(--text-sub); grid-column:1/-1; text-align:center;">Lade Cover...</p>';
        grid.innerHTML = '';

        for (let item of items) {
            const oembedData = await fetchCover(item.spotifyUrl);
            
            const el = document.createElement('div');
            el.className = 'card';
            el.innerHTML = `
                <div class="cover-wrap">
                    <img src="${oembedData.cover}" alt="${item.title}">
                </div>
                <div class="title">${item.title || oembedData.title}</div>
                <div class="sub">${item.sub || 'Spotify'}</div>
            `;
            
            el.onclick = () => {
                window.location.href = item.spotifyUrl;
            };
            grid.appendChild(el);
        }
    }

    document.getElementById('addToggle').onclick = () => {
        document.getElementById('addModal').classList.add('open');
    };

    function closeAddModal() {
        document.getElementById('addModal').classList.remove('open');
    }

    async function addCustomItem() {
        const url = document.getElementById('spotifyUrlInput').value.trim();
        if (!url) return;

        const data = await fetchCover(url);
        items.push({
            title: data.title,
            sub: 'Hinzugefügt',
            spotifyUrl: url
        });

        localStorage.setItem('my_hoerspiele', JSON.stringify(items));
        document.getElementById('spotifyUrlInput').value = '';
        closeAddModal();
        renderGrid();
    }

    document.getElementById('nightToggle').onclick = () => document.body.classList.toggle('night-mode');

    renderGrid();
</script>
</body>
</html>
